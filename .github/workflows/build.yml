name: Auto Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Select Target Device Architecture'
        required: true
        default: 'tv'
        type: choice
        options:
          - tv
          - phone

permissions:
  contents: write

jobs:
  build_apk:
    name: Auto Build, Version & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configure Git identity to allow auto-committing the version bump back to main
      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 1. Auto-detect, increment, and write version number in pubspec.yaml
      - name: Auto-Increment and Write Version
        id: auto_version
        run: |
          # Read current version from pubspec.yaml (e.g., version: 1.0.0+1)
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          echo "Current version in pubspec: $CURRENT_VERSION"
          
          # Separate base version (1.0.0) and build number (1)
          BASE_VER=$(echo $CURRENT_VERSION | cut -d'+' -f1)
          BUILD_NUM=$(echo $CURRENT_VERSION | cut -d'+' -f2)
          if [ -z "$BUILD_NUM" ]; then BUILD_NUM=0; fi
          
          # Automatically increment build number by 1
          NEW_BUILD=$((BUILD_NUM + 1))
          NEW_VERSION="${BASE_VER}+${NEW_BUILD}"
          
          echo "New auto-incremented version: $NEW_VERSION"
          
          # Write the new version back into pubspec.yaml automatically
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          
          # Export for subsequent steps and tagging
          echo "tag_name=v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_number=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          # Commit the updated pubspec.yaml back to main with [skip ci] to prevent loops
          git add pubspec.yaml
          git commit -m "chore(version): auto-bump version to $NEW_VERSION [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped or unneeded"

      # 2. Configure Target Architecture (TV vs Phone)
      - name: Configure Target Architecture
        id: set_target
        run: |
          TARGET="${{ github.event.inputs.target_device }}"
          if [ -z "$TARGET" ]; then
            TARGET="tv" # Fallback default for automated push events
          fi
          
          if [ "$TARGET" == "phone" ]; then
            echo "PLATFORM=android-arm64" >> $GITHUB_ENV
            echo "APK_SUFFIX=phone-arm64" >> $GITHUB_ENV
            echo "Targeting Android Phone (arm64)"
          else
            echo "PLATFORM=android-arm" >> $GITHUB_ENV
            echo "APK_SUFFIX=tv-armv7a" >> $GITHUB_ENV
            echo "Targeting Chromecast TV (armv7a)"
          fi

      # 3. Setup Android Keystore if secrets exist
      - name: Setup Android Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Keystore secret found. Configuring signing..."
            mkdir -p android/app
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks
            echo "storeFile=${{ github.workspace }}/android/app/release-key.jks" >> android/key.properties
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          else
            echo "No keystore secret provided. Skipping signing."
          fi

      # 4. Build Optimized Release APK for the selected target platform
      - name: Build Optimized APK Release
        run: flutter build apk --release --target-platform ${{ env.PLATFORM }}

      # 5. Rename APK to distinguish TV vs Phone builds
      - name: Prepare APK Artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/matrix-client-${{ env.APK_SUFFIX }}-v${{ steps.auto_version.outputs.version_number }}.apk

      # 6. Upload release APK to GitHub Releases using the auto-written version tag
      - name: Upload Release APK to GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.apk
          name: Release v${{ steps.auto_version.outputs.version_number }}
          tag_name: ${{ steps.auto_version.outputs.tag_name }}
          body: "Fully automated build and version bump to v${{ steps.auto_version.outputs.version_number }} (${{ env.APK_SUFFIX }})."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
